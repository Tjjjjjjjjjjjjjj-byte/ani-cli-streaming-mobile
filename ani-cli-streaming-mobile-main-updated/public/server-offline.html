<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191430" />
    <title>Server is starting…</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        background: #191430; color: #efeafb;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5;
      }
      main { width: 100%; max-width: 420px; text-align: center; }
      .spinner {
        width: 44px; height: 44px; margin: 0 auto 20px; border-radius: 50%;
        border: 4px solid #3a3060; border-top-color: #ff7a9c; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { margin: 0 0 8px; font-size: 1.35rem; }
      p { margin: 0 0 14px; color: #a59dc2; }
      .actions { display: grid; gap: 10px; margin: 22px 0 18px; }
      a.btn {
        display: block; padding: 12px 16px; border-radius: 10px; font-weight: 600;
        text-decoration: none; border: 1px solid #3a3060; color: #efeafb;
      }
      a.btn.primary { background: #ff7a9c; border-color: #ff7a9c; color: #191430; }
      code {
        display: block; padding: 10px 12px; border-radius: 8px; background: #241d42;
        color: #efeafb; font-size: 0.85rem; text-align: left; overflow-x: auto;
      }
      small { color: #a59dc2; }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1>Waiting for the server…</h1>
      <p id="status">Checking again every couple of seconds. This page reloads on its own once the app is up.</p>
      <div class="actions">
        <a class="btn primary" href="intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.termux;end">Open Termux</a>
        <a class="btn" href="/" id="retry">Try now</a>
      </div>
      <p><small>Opening Termux starts the servers if you ran the setup script. If not, run this once in Termux:</small></p>
      <code>bash termux/install.sh</code>
    </main>
    <script>
      var started = Date.now();
      var status = document.getElementById("status");
      document.getElementById("retry").addEventListener("click", function (e) {
        e.preventDefault();
        location.reload();
      });
      function check() {
        fetch("/favicon.svg", { cache: "no-store" })
          .then(function (res) {
            if (res.ok) location.reload();
          })
          .catch(function () {
            var secs = Math.round((Date.now() - started) / 1000);
            status.textContent = "Still waiting… " + secs + "s. Checking again every couple of seconds.";
          });
      }
      setInterval(check, 2000);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) check();
      });
    </script>
  </body>
</html>
